AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 'Checkmate Replay Hub - Infrastructure (Milestones 1, 2 & 3)'

Globals:
  Function:
    Timeout: 10
    Runtime: python3.12
    MemorySize: 128
  HttpApi:
    CorsConfiguration:
      AllowOrigins:
        - '*'
      AllowMethods:
        - GET
        - POST
        - OPTIONS
      AllowHeaders:
        - '*'

Resources:
  # باکت میزبانی فرانت‌اند (مایل‌استون ۱)
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal: '*'
            Action: 's3:GetObject'
            Resource: !Sub 'arn:aws:s3:::${FrontendBucket}/*'

  # باکت ذخیره فایل‌های آپلود شده (مایل‌استون ۲)
  UploadBucket:
    Type: AWS::S3::Bucket
    Properties:
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - '*'
            AllowedMethods:
              - GET
              - PUT
              - POST
            AllowedOrigins:
              - '*'
            MaxAge: 3000

  # جدول ذخیره وضعیت‌ها و توکن‌ها (مایل‌استون ۳)
  SubmissionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: checkmate-submissions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  # نقش IAM با دسترسی‌های لازم
  BackendFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoAndSESAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt SubmissionsTable.Arn
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource: '*'

  # تابع ثبت درخواست و ارسال ایمیل تایید
  SubmitFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: app.submit_handler
      Role: !GetAtt BackendFunctionRole.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref SubmissionsTable
          SENDER_EMAIL: '2030.lida@gmail.com'
      Events:
        SubmitApi:
          Type: HttpApi
          Properties:
            Path: /submit
            Method: post

  # تابع تایید یک‌بار مصرف لینک و تغییر وضعیت به PROCESSING
  ConfirmFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: app.confirm_handler
      Role: !GetAtt BackendFunctionRole.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref SubmissionsTable
      Events:
        ConfirmApi:
          Type: HttpApi
          Properties:
            Path: /confirm
            Method: get

Outputs:
  WebsiteURL:
    Description: 'URL des Frontends'
    Value: !GetAtt FrontendBucket.WebsiteURL
  BucketName:
    Description: 'S3 Frontend Bucket Name'
    Value: !Ref FrontendBucket
  UploadBucketName:
    Description: 'S3 Upload Bucket Name'
    Value: !Ref UploadBucket
  TableName:
    Description: 'DynamoDB Table Name'
    Value: !Ref SubmissionsTable
  ApiEndpoint:
    Description: 'HTTP API Gateway URL'
    Value: !Sub 'https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com'