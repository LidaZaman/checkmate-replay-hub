AWSTemplateFormatVersion: '2010-09-09'
Description: 'Checkmate Replay Hub - Infrastructure (Milestones 1, 2 & 3)'

Resources:
  # باکت میزبانی وب‌سایت فرانت‌اند (مایل‌استون ۱)
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal: '*'
            Action: 's3:GetObject'
            Resource: !Sub 'arn:aws:s3:::${FrontendBucket}/*'

  # باکت ذخیره فایل‌های آپلود شده (مایل‌استون ۲)
  UploadBucket:
    Type: AWS::S3::Bucket
    Properties:
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - '*'
            AllowedMethods:
              - GET
              - PUT
              - POST
            AllowedOrigins:
              - '*'
            MaxAge: 3000

  # جدول ثبت وضعیت‌ها و توکن‌های تایید (مایل‌استون ۳)
  SubmissionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: checkmate-submissions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

Outputs:
  WebsiteURL:
    Description: 'URL des Frontends'
    Value: !GetAtt FrontendBucket.WebsiteURL
  BucketName:
    Description: 'S3 Frontend Bucket Name'
    Value: !Ref FrontendBucket
  UploadBucketName:
    Description: 'S3 Upload Bucket Name'
    Value: !Ref UploadBucket
  TableName:
    Description: 'DynamoDB Table Name'
    Value: !Ref SubmissionsTable