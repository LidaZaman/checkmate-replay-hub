AWSTemplateFormatVersion: '2010-09-09'
Description: 'Checkmate Replay Hub - Milestone 1 & 2 Infrastructure'

Resources:
  # باکت میزبانی وب‌سایت فرانت‌اند (از مایل‌استون ۱)
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal: '*'
            Action: 's3:GetObject'
            Resource: !Sub 'arn:aws:s3:::${FrontendBucket}/*'

  # باکت امن جدید برای ذخیره فایل‌های آپلود شده بازی‌ها (مایل‌استون ۲)
  UploadBucket:
    Type: AWS::S3::Bucket
    Properties:
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - '*'
            AllowedMethods:
              - GET
              - PUT
              - POST
            AllowedOrigins:
              - '*'
            MaxAge: 3000

Outputs:
  WebsiteURL:
    Description: 'URL des Frontends'
    Value: !GetAtt FrontendBucket.WebsiteURL
  BucketName:
    Description: 'S3 Frontend Bucket Name'
    Value: !Ref FrontendBucket
  UploadBucketName:
    Description: 'S3 Upload Bucket Name'
    Value: !Ref UploadBucket